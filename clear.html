<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CASE CLOSED</title>
<style>
body{
  background:black;
  color:#00ff66;
  font-family:Courier New;
  text-align:center;
}
.frame{
  border:3px solid #00ff66;
  padding:40px;
  width:600px;
  margin:100px auto;
}
.blink{
  animation: blink 1s infinite;
}
@keyframes blink{
  0%{opacity:1;}
  50%{opacity:0;}
  100%{opacity:1;}
}
</style>
</head>

<body>
<div class="frame">
<h1 class="blink">CASE CLOSED</h1>
<p>事件はすべて解決した。</p>
<p>おめでとう、名探偵。</p>
</div>
</body>
</html>
