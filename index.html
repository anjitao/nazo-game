<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ファイル</title>

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:sans-serif;
  background: linear-gradient(-45deg, #0078d7, #00a2ff, #005bb5, #0099ff);
  background-size: 400% 400%;
  animation: wave 10s ease infinite;
}

/* 波っぽいアニメーション */
@keyframes wave {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* アイコン */
.icon{
  width:80px;
  text-align:center;
  color:white;
  cursor:pointer;
  margin:20px;
}
.icon img{
  width:50px;
}

/* タスクバー */
.taskbar{
  position:fixed;
  bottom:0;
  width:100%;
  height:40px;
  background:#222;
  color:white;
  display:flex;
  align-items:center;
  padding-left:10px;
}
</style>
</head>

<body>

<div class="icon" onclick="location.href='question1.html'">
  <img src="https://cdn-icons-png.flaticon.com/512/716/716784.png">
  <div>ファイル</div>
</div>

<div class="taskbar">
  🔍 検索
</div>

</body>
</html>
