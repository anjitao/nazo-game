<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CASE 1</title>

<style>
body{margin:0;background:#222;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Courier New;}
.monitor{background:#111;border:8px solid #333;border-radius:10px;width:800px;}
.top-bar{background:#333;padding:8px;display:flex;gap:8px;}
.circle{width:12px;height:12px;border-radius:50%;}
.red{background:#ff5f56;}
.yellow{background:#ffbd2e;}
.green{background:#27c93f;}
.screen{background:black;color:#00ff66;padding:20px;}
.header{border-bottom:1px solid #00ff66;margin-bottom:10px;}
.status{animation:blink 1s infinite;}
@keyframes blink{50%{opacity:0.4;}}
input,button{background:black;color:#0f0;border:1px solid #0f0;}
.hint{display:none;}
</style>
</head>

<body>
<div class="monitor">
<div class="top-bar"><div class="circle red"></div><div class="circle yellow"></div><div class="circle green"></div></div>
<div class="screen">

<div class="header">
CASE FILE : INCIDENT-001<br>
USER : DETECTIVE<br>
<span class="status">STATUS : ANALYZING...</span>
</div>

<p>CASE 1 / 5</p>
<p>パスワードを入力してください（半角数字）</p>

<button onclick="hint.style.display='block'">ヒント</button>
<p id="hint" class="hint">答えは 4969</p>

<input id="a"><br>
<button onclick="check()">送信</button>
<p id="msg"></p>

</div></div>

<script>
function check(){
if(a.value==="4969"){
location.href="question2.html";
}else{msg.innerText="ACCESS DENIED";}
}
</script>
</body>
</html>
