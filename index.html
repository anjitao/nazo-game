<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ファイル</title>

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:sans-serif;

  background: url("win10_haikei_01-810x450.jpg") no-repeat center center;
  background-size: cover;
}

/* 波 */
.wave{
  position:absolute;
  bottom:0;
  width:200%;
  height:200px;
  background: url("data:image/svg+xml;utf8,\
  <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 320'>\
  <path fill='%2300a2ff' fill-opacity='1' d='M0,160L48,165.3C96,171,192,181,288,165.3C384,149,480,107,576,96C672,85,768,107,864,122.7C960,139,1056,149,1152,133.3C1248,117,1344,75,1392,53.3L1440,32L1440,320L0,320Z'></path>\
  </svg>");
  background-repeat: repeat-x;
  animation: waveMove 10s linear infinite;
}

@keyframes waveMove{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* アイコン */
.icon{
  width:80px;
  text-align:center;
  color:white;
  cursor:pointer;
  margin:20px;
  position:relative;
  z-index:2;
}
.icon img{
  width:50px;
}

/* タスクバー */
.taskbar{
  position:fixed;
  bottom:0;
  width:100%;
  height:40px;
  background:#222;
  color:white;
  display:flex;
  align-items:center;
  padding-left:10px;
  z-index:2;
}
</style>
</head>

<body>

<!-- 波 -->
<div class="wave"></div>

<!-- アイコン -->
<div class="icon" onclick="location.href='question1.html'">
  <img src="https://cdn-icons-png.flaticon.com/512/716/716784.png">
  <div>ファイル</div>
</div>

<!-- タスクバー -->
<div class="taskbar">
  🔍 検索
</div>

</body>
</html>
