<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>第1問｜捜査端末</title>

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: "Courier New", monospace;
    }

    /* PC外枠 */
    .pc-frame {
      width: 90%;
      max-width: 700px;
      margin: 40px auto;
      border: 4px solid #333;
      background: #111;
      box-shadow: 0 0 20px #0f0;
    }

    /* 上の情報バー */
    .pc-header {
      background: #020;
      color: #0f0;
      padding: 10px;
      font-size: 14px;
      border-bottom: 2px solid #0f0;
    }

    /* 画面部分 */
    .pc-screen {
      padding: 30px;
      color: #0f0;
      text-align: center;
    }

    input {
      background: black;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 6px;
      font-family: inherit;
    }

    button {
      background: black;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 6px 12px;
      margin-top: 10px;
      cursor: pointer;
      font-family: inherit;
    }

    button:hover {
      background: #0f0;
      color: black;
    }

    #hint {
      display: none;
      margin-top: 15px;
      color: #9f9;
    }
  </style>
</head>

<body>

  <div class="pc-frame">

    <div class="pc-header">
      CASE FILE : INCIDENT-001<br>
      USER : DETECTIVE<br>
      STATUS : ANALYZING...
    </div>

    <div class="pc-screen">
      <h1>第1問</h1>

      <p>
        朝にはあって、昼にはなく、<br>
        夜にまた現れるものは何？
      </p>

      <input id="a" placeholder="答えを入力"><br><br>

      <button onclick="check()">答える</button><br>
      <button onclick="showHint()">ヒントを見る</button>

      <p id="hint">空を見上げてみよう</p>
    </div>

  </div>

  <script>
    function showHint() {
      document.getElementById("hint").style.display = "block";
    }

    function check() {
      const a = document.getElementById("a").value.trim();
      if (a === "星" || a === "ほし") {
        location.href = "question2.html";
      } else {
        alert("違います");
      }
    }
  </script>

</body>
</html>
