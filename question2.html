<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CASE 2</title>
<style>
body{
  background:black;
  color:#00ff66;
  font-family: "Courier New", monospace;
}
.frame{
  border:2px solid #00ff66;
  padding:20px;
  width:600px;
  margin:50px auto;
}
.hint{
  display:none;
  margin-top:10px;
}
button{
  background:black;
  color:#00ff66;
  border:1px solid #00ff66;
  margin-top:10px;
}
</style>
</head>

<body>
<div class="frame">
<p>CASE 2 / 5</p>

<h2>問題</h2>
<p>開けると閉じ、閉じると開くものは何だ？</p>

<button onclick="showHint()">ヒントを見る</button>
<p id="hint" class="hint">紙をまとめる文房具だ</p>

<input id="answer">
<button onclick="check()">送信</button>

<p id="msg"></p>
</div>

<script>
function showHint(){
  document.getElementById("hint").style.display="block";
}
function check(){
  const a=document.getElementById("answer").value;
  if(a==="はさみ"||a==="ハサミ"){
    location.href="question3.html";
  }else{
    msg.innerText="違う…もう一度考えろ";
  }
}
</script>
</body>
</html>
