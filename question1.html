<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ファイル</title>

<style>
body{
  margin:0;
  height:100vh;
  background:url("haikei.jpg") center/cover;
  font-family:sans-serif;
}
.box{
  width:600px;
  margin:80px auto;
  background:rgba(255,255,255,0.9);
  padding:20px;
  border-radius:10px;
  text-align:center;
}
.hint-area{
  display:none;
  margin-top:20px;
  align-items:flex-start;
  gap:15px;
}
.chara{width:120px;}
.bubble{
  background:white;
  padding:10px;
  border-radius:10px;
  position:relative;
}
.bubble:before{
  content:"";
  position:absolute;
  left:-10px;
  top:15px;
  border:10px solid transparent;
  border-right:10px solid white;
}
</style>
</head>

<body>
<div class="box">

<h2>小箱を開けろ</h2>
<p>パスワードを入力</p>

<input id="a">
<button onclick="check()">送信</button>

<br><br>
<button onclick="showHint()">ヒント</button>

<div id="hint" class="hint-area">
  <img id="chara" src="" class="chara">
  <div class="bubble" id="hintText"></div>
</div>

</div>

<script>
function check(){
  if(a.value==="4969"){
    location.href="question2.html";
  }else{alert("違う");}
}

let step=0;
function showHint(){
  hint.style.display="flex";
  step++;
  if(step==1){
    hintText.innerHTML="莉波：6が3回出ている…";
    chara.src="riha.png";
  }
  else if(step==2){
    hintText.innerHTML="広：ハ・ホ・ヘ…";
    chara.src="hiro.png";
  }
  else if(step==3){
    hintText.innerHTML="星南：あいうえお表で考えて";
    chara.src="seinan.png";
  }
}
</script>

</body>
</html>
