<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>謎1</title>
<style>
body{font-family:sans-serif;text-align:center;}
#hint{display:none;}
</style>
</head>

<body>

<h2>小箱を開けろ</h2>
<p>パスワードを入力してください（半角数字）</p>

<button onclick="showHint()">ヒント</button>
<p id="hint">
莉波：6が3回出ている…<br>
広：ハ・ホ・ヘ…<br>
星南：あいうえお表で考えて
</p>

<input id="a">
<button onclick="check()">送信</button>

<script>
function showHint(){
  hint.style.display="block";
}
function check(){
  if(a.value==="4969"){
    alert("小箱が開いた！");
    location.href="nazo2.html";
  }else{
    alert("違う");
  }
}
</script>

</body>
</html>
