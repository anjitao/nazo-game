<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CASE 4</title>
<style>
body{background:black;color:#00ff66;font-family:Courier New;}
.frame{border:2px solid #00ff66;padding:20px;width:600px;margin:50px auto;}
.hint{display:none;}
button{background:black;color:#00ff66;border:1px solid #00ff66;}
</style>
</head>

<body>
<div class="frame">
<p>CASE 4 / 5</p>

<h2>問題</h2>
<p>雨の日に活躍し、晴れの日は眠っているものは？</p>

<button onclick="hint.style.display='block'">ヒントを見る</button>
<p id="hint" class="hint">手に持って使う</p>

<input id="answer">
<button onclick="check()">送信</button>
<p id="msg"></p>
</div>

<script>
function check(){
  const a=answer.value;
  if(a==="傘"||a==="かさ"){
    location.href="question5.html";
  }else{
    msg.innerText="まだ見落としがある";
  }
}
</script>
</body>
</html>
