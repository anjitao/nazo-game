<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CASE FILE 04</title>
<style>
body{background:black;color:#00ff66;font-family:Courier New;}
.frame{border:2px solid #00ff66;padding:20px;width:600px;margin:50px auto;}
button{background:black;color:#00ff66;border:1px solid #00ff66;}
</style>
</head>

<body>
<div class="frame">
<h2>CASE FILE 04</h2>

<p>問題：<br>
雨の日に活躍し、晴れの日は眠っているものは？
</p>

<button onclick="alert('手に持つものだ')">ヒント</button>

<br><br>
<input id="answer">
<button onclick="check()">送信</button>
<p id="msg"></p>
</div>

<script>
function check(){
  const a=document.getElementById("answer").value;
  if(a==="かさ"||a==="傘"){
    location.href="question5.html";
  }else{
    msg.innerText="まだ何か見落としている…";
  }
}
</script>
</body>
</html>
