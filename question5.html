<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CASE 5</title>
<style>
body{background:black;color:#00ff66;font-family:Courier New;}
.frame{border:2px solid #00ff66;padding:20px;width:600px;margin:50px auto;}
.hint{display:none;}
button{background:black;color:#00ff66;border:1px solid #00ff66;}
</style>
</head>

<body>
<div class="frame">
<p>CASE 5 / 5</p>

<h2>問題</h2>
<p>朝はあって、昼にはなく、夜にまた現れるものは？</p>

<button onclick="hint.style.display='block'">ヒントを見る</button>
<p id="hint" class="hint">空を見上げろ</p>

<input id="answer">
<button onclick="check()">送信</button>
<p id="msg"></p>
</div>

<script>
function check(){
  const a=answer.value;
  if(a==="星"||a==="ほし"){
    location.href="clear.html";
  }else{
    msg.innerText="事件はまだ終わらない";
  }
}
</script>
</body>
</html>
