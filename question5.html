<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CASE FILE 05</title>
<style>
body{background:black;color:#00ff66;font-family:Courier New;}
.frame{border:2px solid #00ff66;padding:20px;width:600px;margin:50px auto;}
button{background:black;color:#00ff66;border:1px solid #00ff66;}
</style>
</head>

<body>
<div class="frame">
<h2>CASE FILE 05</h2>

<p>問題：<br>
朝はあって、昼にはなく、夜にまた現れるものは？
</p>

<button onclick="alert('空を見上げろ')">ヒント</button>

<br><br>
<input id="answer">
<button onclick="check()">送信</button>
<p id="msg"></p>
</div>

<script>
function check(){
  const a=document.getElementById("answer").value;
  if(a==="星"||a==="ほし"){
    location.href="clear.html";
  }else{
    msg.innerText="事件はまだ終わっていない";
  }
}
</script>
</body>
</html>
