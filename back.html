<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ファイル</title>

<style>
body{
  margin:0;
  height:100vh;
  background:url("haikei.jpg") center/cover;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
}

/* 枠 */
.box{
  background:rgba(255,255,255,0.9);
  padding:20px;
  border-radius:10px;
  text-align:center;
}

/* 画像デカ表示 */
.clear-img{
  width:80vw;          /* 画面の80% */
  max-width:900px;     /* 最大サイズ */
  border-radius:10px;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
  margin-bottom:20px;
}

/* ボタン */
button{
  padding:10px 20px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

  <!-- 🔥 ここが追加ポイント -->
  <img src="クリア画面.png" class="clear-img">

  <h2>本誌に戻って物語を進めよう！</h2>

  <button onclick="goNext()">次へ</button>

</div>

<script>
function goNext(){
  location.href = localStorage.getItem("nextPage");
}
</script>

</body>
</html>
