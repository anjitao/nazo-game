<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ファイル</title>

<style>
body{
  margin:0;
  height:100vh;
  background:url("haikei.jpg") center/cover;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
}

.box{
  background:rgba(255,255,255,0.9);
  padding:20px;
  border-radius:10px;
  text-align:center;
}

/* 失敗画像デカ表示 */
.fail-img{
  width:80vw;
  max-width:900px;
  border-radius:10px;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
  margin-bottom:20px;
}

button{
  padding:10px 20px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

  <img src="失敗画面.png" class="fail-img">

  <h2>入力が違うようだ…</h2>

  <button onclick="goBack()">戻る</button>

</div>

<script>
function goBack(){
  location.href = localStorage.getItem("returnPage");
}
</script>

</body>
</html>
